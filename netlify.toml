# Netlify publishes public/ as is (no build command).
# Skip the deploy unless public/ changed. The daily data update only changes data/, which the pages
# load from GitHub, so it doesn't use a Netlify deploy (each deploy costs 15 of the free plan's 300 monthly credits).
[build]
  publish = "public"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public/"
