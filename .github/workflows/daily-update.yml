name: Daily data update

on:
  schedule:
    # 23:15 UTC on weekdays (7:15 PM Eastern in summer, 6:15 PM in winter),
    # after the Treasury posts the day's closing yields.
    - cron: '15 23 * * 1-5'
  workflow_dispatch:
    inputs:
      force_loans:
        description: 'Rebuild loan data even if no new SEC filings'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install zip-code lookup
        run: pip install zipcodes==1.2.0

      - name: Refresh rates and loans, rebuild the site
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/update.py ${{ inputs.force_loans && '--force-loans' || '' }}

      - name: Commit changes (Netlify deploys automatically)
        run: |
          git config user.name "refiradar-bot"
          git config user.email "refiradar-bot@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "Daily data update $(date -u +%Y-%m-%d)"
            git push
          fi
